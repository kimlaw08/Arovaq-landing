<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AROVAQ — Verified Value Marketplace</title>
    <style>
        /* =========================================================
           AROVAQ — Global Base & Theme Styles
           ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b1919;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 80px;
        }

        /* =========================================================
           AROVAQ — Premium Logo Shine
           Light Bluish/Cyan + Deep Teal + Gold
           ========================================================= */
        .arovaq-logo {
          position: relative;
          display: inline-block;
          overflow: hidden;
          border-radius: 12px;
        }

        .arovaq-logo img {
          display: block;
          width: 100%;
          height: auto;
        }

        /* Premium light sweep */
        .arovaq-logo::after {
          content: "";
          position: absolute;
          top: -40%;
          left: -80%;
          width: 35%;
          height: 180%;

          background: linear-gradient(
            105deg,
            transparent 0%,
            rgba(255, 255, 255, 0.05) 25%,
            rgba(57, 217, 209, 0.55) 45%,
            rgba(255, 255, 255, 0.85) 50%,
            rgba(221, 170, 42, 0.35) 58%,
            transparent 75%
          );

          transform: rotate(18deg);
          pointer-events: none;
          animation: arovaqShine 5s ease-in-out infinite;
        }

        @keyframes arovaqShine {
          0% { left: -80%; opacity: 0; }
          15% { opacity: 1; }
          45% { left: 140%; opacity: 1; }
          55% { left: 140%; opacity: 0; }
          100% { left: 140%; opacity: 0; }
        }

        /* AROVAQ brand gradient */
        .arovaq-brand {
          background: linear-gradient(
            90deg,
            #075E5C,
            #16BFC0,
            #39D9D1,
            #DDAA2A,
            #F4C542
          );
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          font-weight: 800;
        }

        /* =========================================================
           Layout & Cards
           ========================================================= */
        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 24px;
            margin-top: 8px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .drops-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 12px;
        }

        .drop-card {
            background-color: #112525;
            border: 1px solid #1a3838;
            border-radius: 12px;
            padding: 16px;
            min-width: 260px;
            flex: 1;
        }

        .badge {
            background-color: #DDAA2A;
            color: #0b1919;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .drop-card h3 {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .price {
            color: #39D9D1;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .btn-buy {
            background-color: #16BFC0;
            color: #0b1919;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            float: right;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #0e1f1f;
            display: flex;
            justify-content: space-around;
            padding: 12px;
            border-top: 1px solid #1a3838;
        }

        .nav-item {
            color: #8fa8a8;
            text-align: center;
            font-size: 12px;
            text-decoration: none;
        }

        .nav-item.active {
            color: #39D9D1;
        }
    </style>
</head>
<body>

    <header>
        <div class="arovaq-logo">
            <!-- Replace with your actual logo image path if needed -->
            <div style="width: 60px; height: 60px; background: #16BFC0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0b1919; font-size: 24px;">A</div>
        </div>
        <h1 class="arovaq-brand">AROVAQ</h1>
        <p style="font-size: 12px; color: #8fa8a8;">VERIFIED VALUE MARKETPLACE</p>
    </header>

    <div class="section-title">Featured Drops</div>
    <div class="drops-container">
        <div class="drop-card">
            <span class="badge">100% Verified</span>
            <h3>Future Express: The Decentralized Age</h3>
            <div class="price">$8 / KES 1,040</div>
            <button class="btn-buy">Buy Now</button>
        </div>
        <div class="drop-card">
            <span class="badge">100% Verified</span>
            <h3>Creator Economy Blueprint 2026</h3>
            <div class="price">$15 / KES 1,950</div>
            <button class="btn-buy">Buy Now</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active">🛍️ Store</a>
        <a href="#" class="nav-item">📦 Library</a>
    </nav>

</body>
</html>
