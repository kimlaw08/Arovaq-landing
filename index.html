<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arovaq Marketplace</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-bold text-amber-400">Arovaq Store</h1>
    <span id="username" class="text-xs bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-slate-300">Loading...</span>
  </header>

  <main>
    <div id="product-grid" class="grid grid-cols-1 gap-4">
      <p class="text-center text-slate-500 py-8">Loading catalog shelves...</p>
    </div>
  </main>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    if (tg.initDataUnsafe?.user) {
      document.getElementById('username').innerText = `@${tg.initDataUnsafe.user.username || 'Ambassador'}`;
    }

    const SUPABASE_URL = 'https://ftheyucrrfblvgsceitd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_-Ju2MMTnlLQHZ6PQAoxBmw_nL9aSJ3R';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadProducts() {
      const { data, error } = await supabase.from('products').select('*').limit(10);
      const grid = document.getElementById('product-grid');
      
      if (error || !data.length) {
        grid.innerHTML = '<p class="text-center text-slate-400">No products listed yet.</p>';
        return;
      }

      grid.innerHTML = data.map(p => `
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
          <h2 class="font-semibold text-lg text-white">${p.title}</h2>
          <p class="text-amber-400 font-bold my-1">$${p.price}</p>
          <p class="text-sm text-slate-400 mb-3">${p.description}</p>
          <button onclick="alert('Processing checkout for ${p.title}')" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-lg transition">Buy Now</button>
        </div>
      `).join('');
    }
    loadProducts();
  </script>
</body>
</html>
