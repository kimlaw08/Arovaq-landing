<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arovaq Market & Crypto Academy | Decentralized Gateway</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #161b22;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            border: 1px solid #30363d;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #58a6ff; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        .btn {
            display: inline-block;
            background-color: #238636;
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover { background-color: #2ea043; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Arovaq Marketplace</h1>
        <p>Your decentralized gateway for digital assets, instant-split commerce, and Web3 education. Launch the secure Telegram app to start exploring.</p>
        
        <!-- The Dynamic Launch Button -->
        <a id="launchBtn" href="https://t.me/Arovaq_bot" class="btn">🚀 Launch Arovaq Bot</a>
    </div>

    <script>
        // Automatically extract ?ref=ID from the URL and append it to the Telegram bot link
        const urlParams = new URLSearchParams(window.location.search);
        const refId = urlParams.get('ref');
        
        if (refId) {
            const launchBtn = document.getElementById('launchBtn');
            launchBtn.href = `https://t.me/Arovaq_bot?start=${refId}`;
        }
    </script>

</body>
</html>
